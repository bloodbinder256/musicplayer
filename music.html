<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotify Style GitHub Music Player Pro</title>

  <!-- Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000000;
      --sidebar: #121212;
      --panel: #181818;
      --panel-hover: #282828;
      --text: #ffffff;
      --muted: #a7a7a7;
      --accent: #1ed760; /* Spotify Green */
      --accent-hover: #1db954;
      --danger: #e91429;
      --shadow: rgba(0, 0, 0, 0.6);
    }

    body.light {
      --bg: #f8f9fa;
      --sidebar: #ffffff;
      --panel: #f1f3f5;
      --panel-hover: #e9ecef;
      --text: #121212;
      --muted: #6c757d;
      --accent: #1db954;
      --accent-hover: #1aa34a;
      --danger: #dc3545;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Spotify App Grid Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 1fr 90px;
      height: calc(100vh - 90px);
      background: var(--bg);
      gap: 8px;
      padding: 8px;
    }

    /* Sidebar */
    .sidebar {
      background: var(--sidebar);
      border-radius: 8px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .logo i {
      color: var(--accent);
      font-size: 24px;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      transition: color 0.2s, background 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text);
      background: var(--panel-hover);
    }

    .nav-item.active {
      color: var(--accent);
    }

    .sidebar-section {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 16px;
    }

    /* Main Content Viewport */
    .main-viewport {
      background: var(--sidebar);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }

    .viewport-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .search-bar-wrap {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .search-bar-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-bar-wrap input {
      width: 100%;
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 500px;
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar-wrap input:focus {
      border-color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* View Switcher & Buttons */
    .btn {
      background: var(--panel);
      border: none;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 500px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:hover {
      background: var(--panel-hover);
      transform: scale(1.02);
    }

    .btn-accent {
      background: var(--accent);
      color: #000;
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    /* Song Grid View (Spotify Card Style) */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
    }

    .song-card {
      background: var(--panel);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.3s, transform 0.2s;
      position: relative;
    }

    .song-card:hover {
      background: var(--panel-hover);
    }

    .song-card.active {
      border: 1px solid var(--accent);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      background: linear-gradient(135deg, #333, #111);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .card-cover i {
      font-size: 36px;
      color: var(--muted);
    }

    .card-cover canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.6;
      pointer-events: none;
    }

    .card-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* List View mode */
    .song-list-view {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr auto;
      align-items: center;
      padding: 10px 16px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      gap: 12px;
      transition: background 0.2s;
    }

    .song-row:hover {
      background: var(--panel);
    }

    .song-row.active {
      color: var(--accent);
      background: var(--panel);
    }

    /* Persistent Bottom Player Bar */
    .bottom-player {
      grid-column: 1 / -1;
      background: var(--bg);
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      z-index: 20;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-cover {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background: var(--panel);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .mini-cover i {
      font-size: 20px;
      color: var(--muted);
    }

    .mini-info .title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .mini-info .artist {
      font-size: 12px;
      color: var(--muted);
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      color: var(--text);
      transform: scale(1.1);
    }

    .control-btn.active-state {
      color: var(--accent);
    }

    .control-btn.play-pause {
      width: 36px;
      height: 36px;
      background: var(--text);
      color: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
    }

    .control-btn.play-pause:hover {
      transform: scale(1.06);
    }

    .playback-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-size: 11px;
      color: var(--muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--text);
      cursor: pointer;
      height: 4px;
      border-radius: 2px;
    }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--muted);
    }

    .speed-dropdown {
      background: var(--panel);
      color: var(--text);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Modal / Panels */
    .panel-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: #242424;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 24px;
      border-radius: 12px;
      width: min(450px, 90%);
      z-index: 100;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: none;
      opacity: 0;
      transition: all 0.2s ease;
    }

    .panel-modal.show {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .panel-modal h3 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .panel-modal input {
      width: 100%;
      background: #121212;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      margin-bottom: 12px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #000;
      padding: 10px 20px;
      border-radius: 500px;
      font-weight: 700;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 150;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Responsive View */
    @media (max-width: 768px) {
      .app-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 80px;
      }
      .sidebar {
        display: none;
      }
      .bottom-player {
        grid-template-columns: 1fr auto;
      }
      .player-center {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify"></i> GitHubify
      </div>
      <div class="nav-links">
        <button class="nav-item active" id="navHome"><i class="fa-solid fa-house"></i> Home / Library</button>
        <button class="nav-item" id="navHistory"><i class="fa-solid fa-clock-rotate-left"></i> Recently Played</button>
        <button class="nav-item" id="navLocal"><i class="fa-solid fa-file-arrow-down"></i> Local Drop Zone</button>
      </div>
      <div class="sidebar-section">
        <button class="nav-item" id="sidebarSettingsBtn"><i class="fa-solid fa-gear"></i> GitHub Setup</button>
        <button class="nav-item" id="sidebarThemeBtn"><i class="fa-solid fa-circle-half-stroke"></i> Toggle Theme</button>
      </div>
    </aside>

    <!-- Main Content Viewport -->
    <section class="main-viewport" id="dropZone">
      <div class="viewport-header">
        <div class="search-bar-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="search" placeholder="Search songs, artists, or files...">
        </div>
        <div class="header-actions">
          <button class="btn" id="viewToggleBtn" title="Toggle Grid/List View"><i class="fa-solid fa-table-cells-large"></i></button>
          <button class="btn" id="sortBtn"><i class="fa-solid fa-arrow-down-a-z"></i> Sort</button>
        </div>
      </div>

      <div id="contentContainer">
        <!-- Dynamic content injected here -->
      </div>
    </section>

    <!-- Persistent Bottom Player Bar -->
    <footer class="bottom-player">
      <div class="player-left">
        <div class="mini-cover" id="miniCover">
          <canvas id="visualizerCanvas"></canvas>
          <i class="fa-solid fa-music"></i>
        </div>
        <div class="mini-info">
          <div class="title" id="trackTitle">No track selected</div>
          <div class="artist" id="trackArtist">Connect GitHub repo</div>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="control-btn" id="shuffleBtn" title="Shuffle (S)"><i class="fa-solid fa-shuffle"></i></button>
          <button class="control-btn" id="prevBtn" title="Previous (Left Arrow)"><i class="fa-solid fa-backward-step"></i></button>
          <button class="control-btn play-pause" id="playBtn" title="Play/Pause (Space)"><i class="fa-solid fa-play"></i></button>
          <button class="control-btn" id="nextBtn" title="Next (Right Arrow)"><i class="fa-solid fa-forward-step"></i></button>
          <button class="control-btn" id="repeatBtn" title="Repeat (R)"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="playback-bar-row">
          <span id="currentTime">0:00</span>
          <input id="seekSlider" type="range" min="0" max="100" value="0">
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <select id="speedSelect" class="speed-dropdown" title="Playback Speed">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <button class="control-btn" id="muteBtn"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></button>
        <input id="volumeSlider" type="range" min="0" max="100" value="85" style="width: 80px;">
      </div>
    </footer>
  </main>

  <!-- GitHub Settings Modal -->
  <div class="panel-modal" id="settingsModal">
    <h3>GitHub Repository Settings</h3>
    <input id="ownerInput" placeholder="GitHub username or org">
    <input id="repoInput" placeholder="Repository name">
    <input id="branchInput" placeholder="Branch (e.g. main)">
    <input id="folderInput" placeholder="Music folder name">
    <div class="modal-actions">
      <button class="btn" id="closeSettingsBtn">Cancel</button>
      <button class="btn btn-accent" id="saveSettingsBtn">Save & Reload</button>
    </div>
  </div>

  <!-- Rename Modal -->
  <div class="panel-modal" id="renameModal">
    <h3>Edit Song Title</h3>
    <input id="renameInput" placeholder="New display name">
    <div class="modal-actions">
      <button class="btn" id="closeRenameBtn">Cancel</button>
      <button class="btn btn-accent" id="saveRenameBtn">Save</button>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>
  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_SETTINGS = {
      owner: "bloodbinder256",
      repo: "musicplayer",
      branch: "main",
      folder: "music"
    };

    const AUDIO_EXTENSIONS = [".mp3", ".wav", ".ogg", ".flac", ".aac", ".m4a"];
    const STORAGE_KEYS = {
      settings: "githubMusicPlayerSettings",
      renames: "githubMusicPlayerRenames",
      theme: "githubMusicPlayerTheme",
      volume: "githubMusicPlayerVolume",
      history: "githubMusicPlayerHistory"
    };

    const audio = document.getElementById("audio");
    const contentContainer = document.getElementById("contentContainer");
    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const toastEl = document.getElementById("toast");

    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const seekSlider = document.getElementById("seekSlider");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeIcon = document.getElementById("volumeIcon");
    const muteBtn = document.getElementById("muteBtn");
    const speedSelect = document.getElementById("speedSelect");

    const prevBtn = document.getElementById("prevBtn");
    const playBtn = document.getElementById("playBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const searchInput = document.getElementById("searchInput");
    const sortBtn = document.getElementById("sortBtn");
    const viewToggleBtn = document.getElementById("viewToggleBtn");

    const settingsModal = document.getElementById("settingsModal");
    const sidebarSettingsBtn = document.getElementById("sidebarSettingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const ownerInput = document.getElementById("ownerInput");
    const repoInput = document.getElementById("repoInput");
    const branchInput = document.getElementById("branchInput");
    const folderInput = document.getElementById("folderInput");

    const renameModal = document.getElementById("renameModal");
    const renameInput = document.getElementById("renameInput");
    const saveRenameBtn = document.getElementById("saveRenameBtn");
    const closeRenameBtn = document.getElementById("closeRenameBtn");

    const sidebarThemeBtn = document.getElementById("sidebarThemeBtn");
    const navHome = document.getElementById("navHome");
    const navHistory = document.getElementById("navHistory");
    const navLocal = document.getElementById("navLocal");
    const dropZone = document.getElementById("dropZone");
    const canvas = document.getElementById("visualizerCanvas");
    const canvasCtx = canvas.getContext("2d");

    let settings = loadSettings();
    let renames = loadRenames();
    let historyList = loadHistory();
    let tracks = [];
    let filteredTracks = [];
    let currentTrackIndex = 0;
    let selectedRenameFilename = null;
    let isShuffle = false;
    let isRepeat = false;
    let sortAscending = true;
    let isGridView = true;
    let currentViewMode = 'home'; // home, history, local
    let previousVolume = 85;

    let audioCtx, analyser, sourceNode;
    let isAudioInitialized = false;

    function initAudioContext() {
      if (isAudioInitialized) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        isAudioInitialized = true;
        visualize();
      } catch (e) {
        console.warn("Visualizer fallback initialized", e);
      }
    }

    function visualize() {
      requestAnimationFrame(visualize);
      canvas.width = canvas.offsetWidth || 56;
      canvas.height = canvas.offsetHeight || 56;
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      if (!audio.paused && analyser) {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillStyle = "rgba(30, 215, 96, 0.8)";
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
    }

    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || "null");
      return { ...DEFAULT_SETTINGS, ...(saved || {}) };
    }
    function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }
    function loadRenames() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.renames) || "{}"); }
    function saveRenames() { localStorage.setItem(STORAGE_KEYS.renames, JSON.stringify(renames)); }
    function loadHistory() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || "[]"); }
    function saveHistory() { localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(historyList)); }

    function cleanFileName(name) {
      return decodeURIComponent(name).replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").replace(/\s+/g, " ").trim();
    }
    function getDisplayTitle(track) { return renames[track.filename] || track.originalTitle; }
    function isAudioFile(filename) { return AUDIO_EXTENSIONS.some(ext => filename.toLowerCase().endsWith(ext)); }

    function githubApiUrl() {
      const folder = settings.folder.split("/").map(encodeURIComponent).join("/");
      return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${folder}?ref=${settings.branch}`;
    }
    function rawGithubUrl(filename) {
      const encodedFolder = settings.folder.split("/").map(encodeURIComponent).join("/");
      return `https://raw.githubusercontent.com/${settings.owner}/${settings.repo}/${settings.branch}/${encodedFolder}/${encodeURIComponent(filename)}`;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    async function loadPlaylistFromGitHub() {
      try {
        const response = await fetch(githubApiUrl());
        if (!response.ok) throw new Error(`GitHub request failed`);
        const files = await response.json();
        tracks = files
          .filter(file => file.type === "file" && isAudioFile(file.name))
          .map(file => ({
            originalTitle: cleanFileName(file.name),
            filename: file.name,
            url: rawGithubUrl(file.name),
            githubPage: file.html_url,
            isLocal: false
          }));
        applySearchAndSort();
        if (tracks.length > 0 && !audio.src) loadTrack(0);
        showToast(`${tracks.length} tracks loaded from GitHub`);
      } catch (error) {
        console.error(error);
        contentContainer.innerHTML = `<div style="color:var(--muted); text-align:center; padding:40px;">Could not load from GitHub. Check your Setup settings.</div>`;
      }
    }

    function applySearchAndSort() {
      let sourceTracks = tracks;
      if (currentViewMode === 'history') {
        sourceTracks = historyList;
      }

      const query = searchInput.value.trim().toLowerCase();
      filteredTracks = sourceTracks.filter(track => {
        const title = getDisplayTitle(track).toLowerCase();
        const file = track.filename.toLowerCase();
        return title.includes(query) || file.includes(query);
      });

      filteredTracks.sort((a, b) => {
        const res = getDisplayTitle(a).localeCompare(getDisplayTitle(b));
        return sortAscending ? res : -res;
      });

      renderContent();
    }

    function renderContent() {
      contentContainer.innerHTML = "";

      if (!filteredTracks.length) {
        contentContainer.innerHTML = `<div style="color:var(--muted); text-align:center; padding:50px;">No songs found.</div>`;
        return;
      }

      if (isGridView) {
        const grid = document.createElement("div");
        grid.className = "song-grid";
        filteredTracks.forEach((track) => {
          const realIndex = tracks.findIndex(item => item.filename === track.filename);
          const card = document.createElement("div");
          card.className = "song-card";
          if (realIndex === currentTrackIndex) card.classList.add("active");

          card.innerHTML = `
            <div class="card-cover">
              <i class="fa-solid fa-music"></i>
            </div>
            <div class="card-title">${getDisplayTitle(track)}</div>
            <div class="card-subtitle">${track.filename}</div>
          `;

          card.addEventListener("click", () => {
            if (realIndex !== -1) {
              loadTrack(realIndex);
              playTrack();
            }
          });
          grid.appendChild(card);
        });
        contentContainer.appendChild(grid);
      } else {
        const list = document.createElement("div");
        list.className = "song-list-view";
        filteredTracks.forEach((track, idx) => {
          const realIndex = tracks.findIndex(item => item.filename === track.filename);
          const row = document.createElement("div");
          row.className = "song-row";
          if (realIndex === currentTrackIndex) row.classList.add("active");

          row.innerHTML = `
            <div>${idx + 1}</div>
            <div style="font-weight:700;">${getDisplayTitle(track)}</div>
            <div style="color:var(--muted); font-size:13px;">${track.filename}</div>
            <button class="btn" style="padding:4px 8px; font-size:12px;" data-action="rename"><i class="fa-solid fa-pen"></i></button>
          `;

          row.addEventListener("click", (e) => {
            if (e.target.closest("button")?.dataset.action === "rename") {
              openRenameModal(track.filename);
              return;
            }
            if (realIndex !== -1) {
              loadTrack(realIndex);
              playTrack();
            }
          });
          list.appendChild(row);
        });
        contentContainer.appendChild(list);
      }
    }

    function loadTrack(index) {
      if (!tracks.length) return;
      currentTrackIndex = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrackIndex];

      audio.src = track.url;
      audio.playbackRate = Number(speedSelect.value);
      trackTitle.textContent = getDisplayTitle(track);
      trackArtist.textContent = track.filename;
      seekSlider.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";

      // Add to history
      if (!historyList.some(h => h.filename === track.filename)) {
        historyList.unshift(track);
        if (historyList.length > 20) historyList.pop();
        saveHistory();
      }

      // Media Session API Integration for Lock Screen / OS controls
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: getDisplayTitle(track),
          artist: settings.owner,
          album: settings.repo
        });
        navigator.mediaSession.setActionHandler('play', playTrack);
        navigator.mediaSession.setActionHandler('pause', pauseTrack);
        navigator.mediaSession.setActionHandler('previoustrack', previousTrack);
        navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
      }

      renderContent();
    }

    function playTrack() {
      if (!audio.src) return;
      initAudioContext();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

      audio.play().then(() => {
        playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
      }).catch(() => showToast("Tap play again to enable audio"));
    }

    function pauseTrack() {
      audio.pause();
      playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
    }

    function togglePlay() {
      if (!audio.src) return;
      audio.paused ? playTrack() : pauseTrack();
    }

    function nextTrack() {
      if (!tracks.length) return;
      if (isShuffle) {
        loadTrack(Math.floor(Math.random() * tracks.length));
      } else {
        loadTrack(currentTrackIndex + 1);
      }
      playTrack();
    }

    function previousTrack() {
      loadTrack(currentTrackIndex - 1);
      playTrack();
    }

    function openRenameModal(filename) {
      selectedRenameFilename = filename;
      const track = tracks.find(t => t.filename === filename);
      renameInput.value = renames[filename] || track?.originalTitle || "";
      renameModal.classList.add("show");
    }

    // Local Drag and Drop Support
    dropZone.addEventListener("dragover", (e) => e.preventDefault());
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files).filter(file => isAudioFile(file.name));
      if (files.length === 0) return;

      const newTracks = files.map(file => ({
        originalTitle: cleanFileName(file.name),
        filename: file.name,
        url: URL.createObjectURL(file),
        githubPage: "#",
        isLocal: true
      }));

      tracks.push(...newTracks);
      applySearchAndSort();
      showToast(`Added ${files.length} local file(s)`);
      if (tracks.length === newTracks.length) loadTrack(0);
    });

    // Event Handlers
    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", nextTrack);
    prevBtn.addEventListener("click", previousTrack);

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active-state", isShuffle);
      showToast(isShuffle ? "Shuffle on" : "Shuffle off");
    });

    repeatBtn.addEventListener("click", () => {
      isRepeat = !isRepeat;
      audio.loop = isRepeat;
      repeatBtn.classList.toggle("active-state", isRepeat);
      showToast(isRepeat ? "Repeat on" : "Repeat off");
    });

    audio.addEventListener("ended", () => { if (!isRepeat) nextTrack(); });
    audio.addEventListener("pause", () => { playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`; });
    audio.addEventListener("play", () => { playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`; });
    audio.addEventListener("loadedmetadata", () => { durationEl.textContent = formatTime(audio.duration); });
    audio.addEventListener("timeupdate", () => {
      if (!Number.isFinite(audio.duration)) return;
      seekSlider.value = (audio.currentTime / audio.duration) * 100 || 0;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    seekSlider.addEventListener("input", () => {
      if (!Number.isFinite(audio.duration)) return;
      audio.currentTime = (seekSlider.value / 100) * audio.duration;
    });

    volumeSlider.addEventListener("input", () => {
      const vol = Number(volumeSlider.value);
      audio.volume = vol / 100;
      volumeIcon.className = vol === 0 ? "fa-solid fa-volume-xmark" : vol < 50 ? "fa-solid fa-volume-low" : "fa-solid fa-volume-high";
      localStorage.setItem(STORAGE_KEYS.volume, vol);
    });

    muteBtn.addEventListener("click", () => {
      if (audio.volume > 0) {
        previousVolume = audio.volume * 100;
        audio.volume = 0;
        volumeSlider.value = 0;
        volumeIcon.className = "fa-solid fa-volume-xmark";
      } else {
        const rest = previousVolume || 85;
        audio.volume = rest / 100;
        volumeSlider.value = rest;
        volumeIcon.className = "fa-solid fa-volume-high";
      }
    });

    speedSelect.addEventListener("change", () => { audio.playbackRate = Number(speedSelect.value); });

    viewToggleBtn.addEventListener("click", () => {
      isGridView = !isGridView;
      viewToggleBtn.innerHTML = isGridView ? `<i class="fa-solid fa-table-cells-large"></i>` : `<i class="fa-solid fa-bars"></i>`;
      renderContent();
    });

    sortBtn.addEventListener("click", () => {
      sortAscending = !sortAscending;
      sortBtn.innerHTML = sortAscending ? `<i class="fa-solid fa-arrow-down-a-z"></i> Sort` : `<i class="fa-solid fa-arrow-up-z-a"></i> Sort`;
      applySearchAndSort();
    });

    searchInput.addEventListener("input", applySearchAndSort);

    navHome.addEventListener("click", () => {
      currentViewMode = 'home';
      navHome.classList.add("active");
      navHistory.classList.remove("active");
      applySearchAndSort();
    });

    navHistory.addEventListener("click", () => {
      currentViewMode = 'history';
      navHistory.classList.add("active");
      navHome.classList.remove("active");
      applySearchAndSort();
    });

    sidebarThemeBtn.addEventListener("click", () => {
      const isLight = document.body.classList.toggle("light");
      localStorage.setItem(STORAGE_KEYS.theme, isLight ? "light" : "dark");
    });

    sidebarSettingsBtn.addEventListener("click", () => {
      ownerInput.value = settings.owner;
      repoInput.value = settings.repo;
      branchInput.value = settings.branch;
      folderInput.value = settings.folder;
      settingsModal.classList.add("show");
    });

    closeSettingsBtn.addEventListener("click", () => settingsModal.classList.remove("show"));
    saveSettingsBtn.addEventListener("click", () => {
      settings = {
        owner: ownerInput.value.trim() || DEFAULT_SETTINGS.owner,
        repo: repoInput.value.trim() || DEFAULT_SETTINGS.repo,
        branch: branchInput.value.trim() || DEFAULT_SETTINGS.branch,
        folder: folderInput.value.trim() || DEFAULT_SETTINGS.folder
      };
      saveSettings();
      settingsModal.classList.remove("show");
      loadPlaylistFromGitHub();
    });

    closeRenameBtn.addEventListener("click", () => renameModal.classList.remove("show"));
    saveRenameBtn.addEventListener("click", () => {
      if (!selectedRenameFilename) return;
      const val = renameInput.value.trim();
      if (val) {
        renames[selectedRenameFilename] = val;
        saveRenames();
      }
      renameModal.classList.remove("show");
      applySearchAndSort();
    });

    // Keyboard Hotkeys
    window.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      else if (e.code === "ArrowRight") nextTrack();
      else if (e.code === "ArrowLeft") previousTrack();
      else if (e.key.toLowerCase() === "r") repeatBtn.click();
      else if (e.key.toLowerCase() === "s") shuffleBtn.click();
      else if (e.key.toLowerCase() === "m") muteBtn.click();
    });

    // Initialization
    if (localStorage.getItem(STORAGE_KEYS.theme) === "light") document.body.classList.add("light");
    const savedVol = Number(localStorage.getItem(STORAGE_KEYS.volume) || 85);
    volumeSlider.value = savedVol;
    audio.volume = savedVol / 100;
    loadPlaylistFromGitHub();
  </script>
</body>
</html>
