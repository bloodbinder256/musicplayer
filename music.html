<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GitHub Music Player Pro</title>

  <!-- Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #080712;
      --panel: rgba(255, 255, 255, 0.1);
      --panel-strong: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --muted: #cfc8e8;
      --accent: #a77cff;
      --accent-2: #ff6ec7;
      --danger: #ff6b8b;
      --success: #78f0c4;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    body.light {
      --bg: #f4f0ff;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --text: #1b142d;
      --muted: #5e5278;
      --accent: #7b3fff;
      --accent-2: #d92b9f;
      --shadow: rgba(57, 32, 92, 0.18);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(167, 124, 255, 0.38), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255, 110, 199, 0.26), transparent 34%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: min(1150px, 100%);
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      box-shadow: 0 24px 70px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .player {
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 680px;
    }

    .library {
      padding: 20px;
      min-height: 680px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    .icon-button,
    button {
      border: none;
      border-radius: 16px;
      cursor: pointer;
      background: var(--panel-strong);
      color: var(--text);
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .icon-button:hover,
    button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      font-size: 17px;
    }

    .cover-wrap {
      display: flex;
      justify-content: center;
      margin: 14px 0 24px;
    }

    .cover {
      width: 210px;
      height: 210px;
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.3), transparent),
        linear-gradient(135deg, var(--accent), var(--accent-2), #ffe066);
      box-shadow: 0 22px 55px var(--shadow);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Canvas visualizer layer inside cover */
    .cover canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .cover::before {
      content: "";
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      border: 12px solid rgba(255,255,255,0.18);
      position: absolute;
      z-index: 2;
    }

    .cover i {
      position: relative;
      font-size: 42px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.28);
      z-index: 3;
    }

    .cover.playing {
      animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    .track-title {
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .track-meta {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      word-break: break-word;
    }

    .track-meta a {
      color: var(--muted);
    }

    .progress-area {
      margin: 4px 0 16px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .controls button {
      height: 46px;
      font-size: 16px;
    }

    .controls .main-play {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 18px;
    }

    .extra-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .volume-row {
      display: grid;
      grid-template-columns: 24px 1fr 42px;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .speed-select {
      background: var(--panel-strong);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: auto;
    }

    .tools button,
    .small-button {
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .library-header h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.04em;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-row input,
    .rename-panel input,
    .settings-panel input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.14);
      outline: none;
      border-radius: 16px;
      padding: 13px 14px;
      color: var(--text);
      background: var(--panel-strong);
      font: inherit;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      max-height: 500px;
    }

    .song {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.075);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .song.dragging {
      opacity: 0.4;
      border: 1px dashed var(--accent);
    }

    .song:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .song.active {
      border-color: rgba(255,255,255,0.26);
      background: linear-gradient(135deg, rgba(167, 124, 255, 0.34), rgba(255, 110, 199, 0.18));
    }

    .drag-handle {
      color: var(--muted);
      cursor: grab;
      padding: 4px;
      font-size: 14px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .song-number {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-strong);
      border-radius: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .song-title {
      font-weight: 800;
      font-size: 14px;
      word-break: break-word;
    }

    .song-file {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-word;
    }

    .song-actions {
      display: flex;
      gap: 6px;
    }

    .song-actions button {
      width: 36px;
      height: 36px;
      border-radius: 13px;
    }

    .panel {
      margin-top: 14px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 14px;
      display: none;
    }

    .panel.show {
      display: block;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .rename-panel .rename-actions,
    .settings-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .rename-actions button,
    .settings-actions button {
      flex: 1;
      padding: 10px;
    }

    .danger {
      color: white;
      background: rgba(255, 107, 139, 0.28);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%) translateY(30px);
      opacity: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      transition: all 0.2s ease;
      font-size: 13px;
      z-index: 30;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Navigation Bar */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-strong);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      justify-content: space-around;
      z-index: 25;
    }

    .mobile-nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 20px;
      border-radius: 12px;
    }

    .mobile-nav-btn i {
      font-size: 18px;
    }

    .mobile-nav-btn.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 870px) {
      body {
        padding: 12px;
        align-items: flex-start;
        padding-bottom: 90px;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .mobile-nav {
        display: flex;
      }

      .app.view-player .library {
        display: none;
      }

      .app.view-library .player {
        display: none;
      }

      .player,
      .library {
        min-height: calc(100vh - 100px);
      }
    }
  </style>
</head>
<body>
  <main class="app view-player" id="appContainer">
    <section class="player card">
      <div class="topbar">
        <div>
          <h1>Music Player</h1>
          <div class="subtitle">GitHub Audio Player Pro</div>
        </div>
        <button class="icon-button" id="themeBtn" title="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

      <div class="cover-wrap">
        <div class="cover" id="cover">
          <canvas id="visualizerCanvas"></canvas>
          <i class="fa-solid fa-music"></i>
        </div>
      </div>

      <div class="track-title" id="trackTitle">Loading playlist...</div>
      <div class="track-meta" id="trackMeta"></div>

      <div class="progress-area">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <input id="seekSlider" type="range" min="0" max="100" value="0">
      </div>

      <audio id="audio" crossorigin="anonymous"></audio>

      <div class="controls">
        <button id="repeatBtn" title="Repeat (R)"><i class="fa-solid fa-repeat"></i></button>
        <button id="prevBtn" title="Previous (Left Arrow)"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn" class="main-play" title="Play/Pause (Space)"><i class="fa-solid fa-play"></i></button>
        <button id="nextBtn" title="Next (Right Arrow)"><i class="fa-solid fa-forward-step"></i></button>
        <button id="shuffleBtn" title="Shuffle (S)"><i class="fa-solid fa-shuffle"></i></button>
      </div>

      <div class="extra-controls">
        <div class="volume-row">
          <button id="muteBtn" style="background:none; border:none; color:var(--muted); cursor:pointer; padding:0;"><i class="fa-solid fa-volume-low" id="volumeIcon"></i></button>
          <input id="volumeSlider" type="range" min="0" max="100" value="85">
          <span id="volumeText">85%</span>
        </div>
        <select id="speedSelect" class="speed-select" title="Playback Speed">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
      </div>

      <div class="tools">
        <button id="copyLinkBtn"><i class="fa-solid fa-link"></i> Copy</button>
        <button id="downloadBtn"><i class="fa-solid fa-download"></i> File</button>
        <button id="settingsBtn"><i class="fa-solid fa-gear"></i> Setup</button>
      </div>

      <div class="settings-panel panel" id="settingsPanel">
        <h3>GitHub settings</h3>
        <input id="ownerInput" placeholder="GitHub username">
        <br><br>
        <input id="repoInput" placeholder="Repository name">
        <br><br>
        <input id="branchInput" placeholder="Branch, e.g. main">
        <br><br>
        <input id="folderInput" placeholder="Music folder">
        <div class="settings-actions">
          <button id="saveSettingsBtn">Save & reload</button>
          <button id="resetSettingsBtn" class="danger">Reset</button>
        </div>
      </div>

      <div class="status" id="status"></div>
    </section>

    <section class="library card">
      <div class="library-header">
        <h2>Library</h2>
        <button class="small-button" id="sortBtn"><i class="fa-solid fa-arrow-down-a-z"></i> Sort</button>
      </div>

      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Search songs...">
        <button class="small-button" id="clearSearchBtn">Clear</button>
      </div>

      <ul class="playlist" id="
