<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GitHub Music Player Pro</title>

  <!-- Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #080712;
      --panel: rgba(255, 255, 255, 0.1);
      --panel-strong: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --muted: #cfc8e8;
      --accent: #a77cff;
      --accent-2: #ff6ec7;
      --danger: #ff6b8b;
      --success: #78f0c4;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    body.light {
      --bg: #f4f0ff;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --text: #1b142d;
      --muted: #5e5278;
      --accent: #7b3fff;
      --accent-2: #d92b9f;
      --shadow: rgba(57, 32, 92, 0.18);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(167, 124, 255, 0.38), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255, 110, 199, 0.26), transparent 34%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: min(1150px, 100%);
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      box-shadow: 0 24px 70px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .player {
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 680px;
    }

    .library {
      padding: 20px;
      min-height: 680px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    .icon-button,
    button {
      border: none;
      border-radius: 16px;
      cursor: pointer;
      background: var(--panel-strong);
      color: var(--text);
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .icon-button:hover,
    button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      font-size: 17px;
    }

    .cover-wrap {
      display: flex;
      justify-content: center;
      margin: 14px 0 24px;
    }

    .cover {
      width: 210px;
      height: 210px;
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.3), transparent),
        linear-gradient(135deg, var(--accent), var(--accent-2), #ffe066);
      box-shadow: 0 22px 55px var(--shadow);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .cover canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
    }

    .cover::before {
      content: "";
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      border: 12px solid rgba(255,255,255,0.18);
      position: absolute;
      z-index: 2;
    }

    .cover i {
      position: relative;
      font-size: 42px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.28);
      z-index: 3;
    }

    .cover.playing {
      animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    .track-title {
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .track-meta {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      word-break: break-word;
    }

    .track-meta a {
      color: var(--muted);
    }

    .progress-area {
      margin: 4px 0 16px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .controls button {
      height: 46px;
      font-size: 16px;
    }

    .controls .main-play {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 18px;
    }

    .extra-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .volume-row {
      display: grid;
      grid-template-columns: 24px 1fr 42px;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .speed-select {
      background: var(--panel-strong);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: auto;
    }

    .tools button,
    .small-button {
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .library-header h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.04em;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-row input,
    .rename-panel input,
    .settings-panel input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.14);
      outline: none;
      border-radius: 16px;
      padding: 13px 14px;
      color: var(--text);
      background: var(--panel-strong);
      font: inherit;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      max-height: 500px;
    }

    .song {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.075);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .song.dragging {
      opacity: 0.4;
      border: 1px dashed var(--accent);
    }

    .song:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .song.active {
      border-color: rgba(255,255,255,0.26);
      background: linear-gradient(135deg, rgba(167, 124, 255, 0.34), rgba(255, 110, 199, 0.18));
    }

    .drag-handle {
      color: var(--muted);
      cursor: grab;
      padding: 4px;
      font-size: 14px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .song-number {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-strong);
      border-radius: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .song-title {
      font-weight: 800;
      font-size: 14px;
      word-break: break-word;
    }

    .song-file {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-word;
    }

    .song-actions {
      display: flex;
      gap: 6px;
    }

    .song-actions button {
      width: 36px;
      height: 36px;
      border-radius: 13px;
    }

    .panel {
      margin-top: 14px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 14px;
      display: none;
    }

    .panel.show {
      display: block;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .rename-panel .rename-actions,
    .settings-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .rename-actions button,
    .settings-actions button {
      flex: 1;
      padding: 10px;
    }

    .danger {
      color: white;
      background: rgba(255, 107, 139, 0.28);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%) translateY(30px);
      opacity: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      transition: all 0.2s ease;
      font-size: 13px;
      z-index: 30;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-strong);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      justify-content: space-around;
      z-index: 25;
    }

    .mobile-nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 20px;
      border-radius: 12px;
    }

    .mobile-nav-btn i {
      font-size: 18px;
    }

    .mobile-nav-btn.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 870px) {
      body {
        padding: 12px;
        align-items: flex-start;
        padding-bottom: 90px;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .mobile-nav {
        display: flex;
      }

      .app.view-player .library {
        display: none;
      }

      .app.view-library .player {
        display: none;
      }

      .player,
      .library {
        min-height: calc(100vh - 100px);
      }
    }
  </style>
</head>
<body>
  <main class="app view-player" id="appContainer">
    <section class="player card">
      <div class="topbar">
        <div>
          <h1>Music Player</h1>
          <div class="subtitle">GitHub Audio Player Pro</div>
        </div>
        <button class="icon-button" id="themeBtn" title="Toggle theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

      <div class="cover-wrap">
        <div class="cover" id="cover">
          <canvas id="visualizerCanvas"></canvas>
          <i class="fa-solid fa-music"></i>
        </div>
      </div>

      <div class="track-title" id="trackTitle">Loading playlist...</div>
      <div class="track-meta" id="trackMeta"></div>

      <div class="progress-area">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <input id="seekSlider" type="range" min="0" max="100" value="0">
      </div>

      <audio id="audio" crossorigin="anonymous"></audio>

      <div class="controls">
        <button id="repeatBtn" title="Repeat (R)"><i class="fa-solid fa-repeat"></i></button>
        <button id="prevBtn" title="Previous (Left Arrow)"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn" class="main-play" title="Play/Pause (Space)"><i class="fa-solid fa-play"></i></button>
        <button id="nextBtn" title="Next (Right Arrow)"><i class="fa-solid fa-forward-step"></i></button>
        <button id="shuffleBtn" title="Shuffle (S)"><i class="fa-solid fa-shuffle"></i></button>
      </div>

      <div class="extra-controls">
        <div class="volume-row">
          <button id="muteBtn" style="background:none; border:none; color:var(--muted); cursor:pointer; padding:0;"><i class="fa-solid fa-volume-low" id="volumeIcon"></i></button>
          <input id="volumeSlider" type="range" min="0" max="100" value="85">
          <span id="volumeText">85%</span>
        </div>
        <select id="speedSelect" class="speed-select" title="Playback Speed">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
      </div>

      <div class="tools">
        <button id="copyLinkBtn"><i class="fa-solid fa-link"></i> Copy</button>
        <button id="downloadBtn"><i class="fa-solid fa-download"></i> File</button>
        <button id="settingsBtn"><i class="fa-solid fa-gear"></i> Setup</button>
      </div>

      <div class="settings-panel panel" id="settingsPanel">
        <h3>GitHub settings</h3>
        <input id="ownerInput" placeholder="GitHub username">
        <br><br>
        <input id="repoInput" placeholder="Repository name">
        <br><br>
        <input id="branchInput" placeholder="Branch, e.g. main">
        <br><br>
        <input id="folderInput" placeholder="Music folder">
        <div class="settings-actions">
          <button id="saveSettingsBtn">Save & reload</button>
          <button id="resetSettingsBtn" class="danger">Reset</button>
        </div>
      </div>

      <div class="status" id="status"></div>
    </section>

    <section class="library card">
      <div class="library-header">
        <h2>Library</h2>
        <button class="small-button" id="sortBtn"><i class="fa-solid fa-arrow-down-a-z"></i> Sort</button>
      </div>

      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Search songs...">
        <button class="small-button" id="clearSearchBtn">Clear</button>
      </div>

      <ul class="playlist" id="playlist"></ul>

      <div class="rename-panel panel" id="renamePanel">
        <h3>Rename song display title</h3>
        <input id="renameInput" placeholder="New display name">
        <div class="rename-actions">
          <button id="saveRenameBtn">Save name</button>
          <button id="clearRenameBtn" class="danger">Use file name</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-btn active" id="navPlayerBtn">
      <i class="fa-solid fa-compact-disc"></i>
      Player
    </button>
    <button class="mobile-nav-btn" id="navLibraryBtn">
      <i class="fa-solid fa-list-music"></i>
      Library
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_SETTINGS = {
      owner: "bloodbinder256",
      repo: "musicplayer",
      branch: "main",
      folder: "music"
    };

    const AUDIO_EXTENSIONS = [".mp3", ".wav", ".ogg", ".flac", ".aac", ".m4a"];
    const STORAGE_KEYS = {
      settings: "githubMusicPlayerSettings",
      renames: "githubMusicPlayerRenames",
      theme: "githubMusicPlayerTheme",
      volume: "githubMusicPlayerVolume"
    };

    const audio = document.getElementById("audio");
    const cover = document.getElementById("cover");
    const playlistEl = document.getElementById("playlist");
    const trackTitle = document.getElementById("trackTitle");
    const trackMeta = document.getElementById("trackMeta");
    const statusEl = document.getElementById("status");
    const toastEl = document.getElementById("toast");
    const appContainer = document.getElementById("appContainer");

    const navPlayerBtn = document.getElementById("navPlayerBtn");
    const navLibraryBtn = document.getElementById("navLibraryBtn");

    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const seekSlider = document.getElementById("seekSlider");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeText = document.getElementById("volumeText");
    const volumeIcon = document.getElementById("volumeIcon");
    const muteBtn = document.getElementById("muteBtn");
    const speedSelect = document.getElementById("speedSelect");

    const prevBtn = document.getElementById("prevBtn");
    const playBtn = document.getElementById("playBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const themeBtn = document.getElementById("themeBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const settingsBtn = document.getElementById("settingsBtn");
    const sortBtn = document.getElementById("sortBtn");

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const renamePanel = document.getElementById("renamePanel");
    const renameInput = document.getElementById("renameInput");
    const saveRenameBtn = document.getElementById("saveRenameBtn");
    const clearRenameBtn = document.getElementById("clearRenameBtn");

    const settingsPanel = document.getElementById("settingsPanel");
    const ownerInput = document.getElementById("ownerInput");
    const repoInput = document.getElementById("repoInput");
    const branchInput = document.getElementById("branchInput");
    const folderInput = document.getElementById("folderInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const resetSettingsBtn = document.getElementById("resetSettingsBtn");

    const canvas = document.getElementById("visualizerCanvas");
    const canvasCtx = canvas.getContext("2d");

    let settings = loadSettings();
    let renames = loadRenames();
    let tracks = [];
    let filteredTracks = [];
    let currentTrackIndex = 0;
    let selectedRenameFilename = null;
    let isShuffle = false;
    let isRepeat = false;
    let sortAscending = true;
    let previousVolume = 85;

    let audioCtx, analyser, sourceNode;
    let isAudioInitialized = false;

    function initAudioContext() {
      if (isAudioInitialized) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        isAudioInitialized = true;
        visualize();
      } catch (e) {
        console.warn("Visualizer fallback initialized due to CORS restriction:", e);
      }
    }

    function visualize() {
      requestAnimationFrame(visualize);
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      if (!audio.paused && analyser) {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillStyle = "rgba(255, 255, 255, 0.5)";
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
    }

    navPlayerBtn.addEventListener("click", () => {
      appContainer.className = "app view-player";
      navPlayerBtn.classList.add("active");
      navLibraryBtn.classList.remove("active");
    });

    navLibraryBtn.addEventListener("click", () => {
      appContainer.className = "app view-library";
      navLibraryBtn.classList.add("active");
      navPlayerBtn.classList.remove("active");
    });

    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || "null");
      return { ...DEFAULT_SETTINGS, ...(saved || {}) };
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
    }

    function loadRenames() {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.renames) || "{}");
    }

    function saveRenames() {
      localStorage.setItem(STORAGE_KEYS.renames, JSON.stringify(renames));
    }

    function cleanFileName(name) {
      return decodeURIComponent(name)
        .replace(/\.[^/.]+$/, "")
        .replace(/[-_]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getDisplayTitle(track) {
      return renames[track.filename] || track.originalTitle;
    }

    function isAudioFile(filename) {
      const lower = filename.toLowerCase();
      return AUDIO_EXTENSIONS.some(ext => lower.endsWith(ext));
    }

    function githubApiUrl() {
      const folder = settings.folder.split("/").map(encodeURIComponent).join("/");
      return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${folder}?ref=${settings.branch}`;
    }

    function rawGithubUrl(filename) {
      const encodedFolder = settings.folder.split("/").map(encodeURIComponent).join("/");
      const encodedFile = encodeURIComponent(filename);
      return `https://raw.githubusercontent.com/${settings.owner}/${settings.repo}/${settings.branch}/${encodedFolder}/${encodedFile}`;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    async function loadPlaylistFromGitHub() {
      try {
        statusEl.textContent = "Fetching music files from GitHub...";
        trackTitle.textContent = "Loading playlist...";
        trackMeta.textContent = "";
        playlistEl.innerHTML = "";

        const response = await fetch(githubApiUrl());
        if (!response.ok) throw new Error(`GitHub request failed: ${response.status}`);

        const files = await response.json();
        tracks = files
          .filter(file => file.type === "file" && isAudioFile(file.name))
          .map(file => ({
            originalTitle: cleanFileName(file.name),
            filename: file.name,
            url: rawGithubUrl(file.name),
            githubPage: file.html_url,
            size: file.size || 0
          }));

        if (tracks.length === 0) {
          trackTitle.textContent = "No audio files found";
          statusEl.textContent = "Check your repository folder name.";
          renderPlaylist();
          return;
        }

        applySearchAndSort();
        loadTrack(0);
        statusEl.textContent = `${tracks.length} track(s) loaded successfully.`;
      } catch (error) {
        console.error(error);
        tracks = [];
        filteredTracks = [];
        renderPlaylist();
        trackTitle.textContent = "Could not load playlist";
        statusEl.textContent = "Check your GitHub setup settings.";
      }
    }

    function applySearchAndSort() {
      const query = searchInput.value.trim().toLowerCase();

      filteredTracks = tracks.filter(track => {
        const title = getDisplayTitle(track).toLowerCase();
        const file = track.filename.toLowerCase();
        return title.includes(query) || file.includes(query);
      });

      filteredTracks.sort((a, b) => {
        const result = getDisplayTitle(a).localeCompare(getDisplayTitle(b));
        return sortAscending ? result : -result;
      });

      renderPlaylist();
    }

    let draggedFilename = null;

    function renderPlaylist() {
      playlistEl.innerHTML = "";

      if (!filteredTracks.length) {
        playlistEl.innerHTML = `<li class="empty">No songs to show.</li>`;
        return;
      }

      filteredTracks.forEach((track, visibleIndex) => {
        const realIndex = tracks.findIndex(item => item.filename === track.filename);
        const li = document.createElement("li");
        li.className = "song";
        if (realIndex === currentTrackIndex) li.classList.add("active");
        li.setAttribute("draggable", "true");
        li.dataset.filename = track.filename;

        li.innerHTML = `
          <div class="drag-handle" title="Drag to reorder"><i class="fa-solid fa-grip-vertical"></i></div>
          <div class="song-number">${visibleIndex + 1}</div>
          <div>
            <div class="song-title">${getDisplayTitle(track)}</div>
            <div class="song-file">${track.filename}</div>
          </div>
          <div class="song-actions">
            <button title="Rename" data-action="rename"><i class="fa-solid fa-pen"></i></button>
            <button title="Play" data-action="play"><i class="fa-solid fa-play"></i></button>
          </div>
        `;

        li.addEventListener("dragstart", () => {
          draggedFilename = track.filename;
          li.classList.add("dragging");
        });

        li.addEventListener("dragend", () => {
          li.classList.remove("dragging");
          draggedFilename = null;
        });

        li.addEventListener("dragover", (e) => {
          e.preventDefault();
        });

        li.addEventListener("drop", (e) => {
          e.preventDefault();
          if (!draggedFilename || draggedFilename === track.filename) return;

          const fromIdx = tracks.findIndex(t => t.filename === draggedFilename);
          const toIdx = tracks.findIndex(t => t.filename === track.filename);

          if (fromIdx !== -1 && toIdx !== -1) {
            const [movedTrack] = tracks.splice(fromIdx, 1);
            tracks.splice(toIdx, 0, movedTrack);
            
            currentTrackIndex = tracks.findIndex(t => t.filename === tracks[currentTrackIndex]?.filename);
            applySearchAndSort();
            showToast("Playlist reordered");
          }
        });

        li.addEventListener("click", event => {
          const action = event.target.closest("button")?.dataset.action;
          if (action === "rename") {
            event.stopPropagation();
            openRenamePanel(track.filename);
            return;
          }

          loadTrack(realIndex);
          playTrack();
          if (window.innerWidth <= 870) navPlayerBtn.click();
        });

        playlistEl.appendChild(li);
      });
    }

    function loadTrack(index) {
      if (!tracks.length) return;
      currentTrackIndex = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrackIndex];

      audio.src = track.url;
      audio.playbackRate = Number(speedSelect.value);
      trackTitle.textContent = getDisplayTitle(track);
      trackMeta.innerHTML = `${track.filename} • <a href="${track.githubPage}" target="_blank" rel="noopener">GitHub</a>`;
      seekSlider.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      renderPlaylist();
    }

    function playTrack() {
      if (!audio.src) return;
      initAudioContext();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      audio.play().then(() => {
        playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        cover.classList.add("playing");
      }).catch(() => {
        statusEl.textContent = "Tap play again if browser blocked autoplay.";
      });
    }

    function pauseTrack() {
      audio.pause();
      playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
      cover.classList.remove("playing");
    }

    function togglePlay() {
      if (!audio.src) return;
      audio.paused ? playTrack() : pauseTrack();
    }

    function nextTrack() {
      if (!tracks.length) return;
      if (isShuffle) return shuffleTrack();
      loadTrack(currentTrackIndex + 1);
      playTrack();
    }

    function previousTrack() {
      loadTrack(currentTrackIndex - 1);
      playTrack();
    }

    function shuffleTrack() {
      if (tracks.length < 2) return;
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * tracks.length);
      } while (randomIndex === currentTrackIndex);
      loadTrack(randomIndex);
      playTrack();
    }

    function openRenamePanel(filename) {
      selectedRenameFilename = filename;
      const track = tracks.find(item => item.filename === filename);
      renameInput.value = renames[filename] || track.originalTitle;
      renamePanel.classList.add("show");
      renameInput.focus();
    }

    function saveRename() {
      if (!selectedRenameFilename) return;
      const newName = renameInput.value.trim();
      if (!newName) return;
      renames[selectedRenameFilename] = newName;
      saveRenames();
      renamePanel.classList.remove("show");
      applySearchAndSort();
      loadTrack(currentTrackIndex);
      showToast("Display name saved");
    }

    function clearRename() {
      if (!selectedRenameFilename) return;
      delete renames[selectedRenameFilename];
      saveRenames();
      renamePanel.classList.remove("show");
      applySearchAndSort();
      loadTrack(currentTrackIndex);
      showToast("Display name reset");
    }

    function fillSettingsInputs() {
      ownerInput.value = settings.owner;
      repoInput.value = settings.repo;
      branchInput.value = settings.branch;
      folderInput.value = settings.folder;
    }

    function saveSettingsFromInputs() {
      settings = {
        owner: ownerInput.value.trim() || DEFAULT_SETTINGS.owner,
        repo: repoInput.value.trim() || DEFAULT_SETTINGS.repo,
        branch: branchInput.value.trim() || DEFAULT_SETTINGS.branch,
        folder: folderInput.value.trim() || DEFAULT_SETTINGS.folder
      };
      saveSettings();
      settingsPanel.classList.remove("show");
      showToast("Settings saved");
      loadPlaylistFromGitHub();
    }

    function resetSettings() {
      localStorage.removeItem(STORAGE_KEYS.settings);
      settings = { ...DEFAULT_SETTINGS };
      fillSettingsInputs();
      showToast("Settings reset");
      loadPlaylistFromGitHub();
    }

    function applySavedTheme() {
      const theme = localStorage.getItem(STORAGE_KEYS.theme) || "dark";
      document.body.classList.toggle("light", theme === "light");
      themeBtn.innerHTML = theme === "light" ? `<i class="fa-solid fa-sun"></i>` : `<i class="fa-solid fa-moon"></i>`;
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle("light");
      localStorage.setItem(STORAGE_KEYS.theme, isLight ? "light" : "dark");
      themeBtn.innerHTML = isLight ? `<i class="fa-solid fa-sun"></i>` : `<i class="fa-solid fa-moon"></i>`;
    }

    function loadSavedVolume() {
      const savedVolume = Number(localStorage.getItem(STORAGE_KEYS.volume) || 85);
      volumeSlider.value = savedVolume;
      audio.volume = savedVolume / 100;
      volumeText.textContent = `${savedVolume}%`;
      updateVolumeIcon(savedVolume);
    }

    function updateVolumeIcon(vol) {
      if (vol === 0) {
        volumeIcon.className = "fa-solid fa-volume-xmark";
      } else if (vol < 50) {
        volumeIcon.className = "fa-solid fa-volume-low";
      } else {
        volumeIcon.className = "fa-solid fa-volume-high";
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;

      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        nextTrack();
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        previousTrack();
      } else if (e.key.toLowerCase() === "r") {
        repeatBtn.click();
      } else if (e.key.toLowerCase() === "s") {
        shuffleBtn.click();
      } else if (e.key.toLowerCase() === "m") {
        muteBtn.click();
      }
    });

    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", nextTrack);
    prevBtn.addEventListener("click", previousTrack);

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.style.background = isShuffle ? "linear-gradient(135deg, var(--accent), var(--accent-2))" : "var(--panel-strong)";
      showToast(isShuffle ? "Shuffle on" : "Shuffle off");
    });

    repeatBtn.addEventListener("click", () => {
      isRepeat = !isRepeat;
      audio.loop = isRepeat;
      repeatBtn.style.background = isRepeat ? "linear-gradient(135deg, var(--accent), var(--accent-2))" : "var(--panel-strong)";
      showToast(isRepeat ? "Repeat on" : "Repeat off");
    });

    audio.addEventListener("ended", () => {
      if (!isRepeat) nextTrack();
    });

    audio.addEventListener("pause", () => {
      playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
      cover.classList.remove("playing");
    });

    audio.addEventListener("play", () => {
      playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
      cover.classList.add("playing");
    });

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (!Number.isFinite(audio.duration)) return;
      seekSlider.value = (audio.currentTime / audio.duration) * 100 || 0;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    seekSlider.addEventListener("input", () => {
      if (!Number.isFinite(audio.duration)) return;
      audio.currentTime = (seekSlider.value / 100) * audio.duration;
    });

    volumeSlider.addEventListener("input", () => {
      const volume = Number(volumeSlider.value);
      audio.volume = volume / 100;
      volumeText.textContent = `${volume}%`;
      updateVolumeIcon(volume);
      localStorage.setItem(STORAGE_KEYS.volume, volume);
    });

    muteBtn.addEventListener("click", () => {
      if (audio.volume > 0) {
        previousVolume = audio.volume * 100;
        audio.volume = 0;
        volumeSlider.value = 0;
        volumeText.textContent = "0%";
        updateVolumeIcon(0);
        showToast("Muted");
      } else {
        const restored = previousVolume || 85;
        audio.volume = restored / 100;
        volumeSlider.value = restored;
        volumeText.textContent = `${restored}%`;
        updateVolumeIcon(restored);
        showToast("Unmuted");
      }
    });

    speedSelect.addEventListener("change", () => {
      audio.playbackRate = Number(speedSelect.value);
      showToast(`Playback speed: ${speedSelect.value}x`);
    });

    themeBtn.addEventListener("click", toggleTheme);
    copyLinkBtn.addEventListener("click", () => {
      const track = tracks[currentTrackIndex];
      if (!track) return;
      navigator.clipboard.writeText(track.url);
      showToast("Raw audio link copied");
    });

    downloadBtn.addEventListener("click", () => {
      const track = tracks[currentTrackIndex];
      if (!track) return;
      window.open(track.url, "_blank", "noopener");
    });

    settingsBtn.addEventListener("click", () => {
      fillSettingsInputs();
      settingsPanel.classList.toggle("show");
    });

    saveSettingsBtn.addEventListener("click", saveSettingsFromInputs);
    resetSettingsBtn.addEventListener("click", resetSettings);

    searchInput.addEventListener("input", applySearchAndSort);
    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      applySearchAndSort();
    });

    sortBtn.addEventListener("click", () => {
      sortAscending = !sortAscending;
      sortBtn.innerHTML = sortAscending
        ? `<i class="fa-solid fa-arrow-down-a-z"></i> Sort`
        : `<i class="fa-solid fa-arrow-up-z-a"></i> Sort`;
      applySearchAndSort();
    });

    saveRenameBtn.addEventListener("click", saveRename);
    clearRenameBtn.addEventListener("click", clearRename);
    renameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") saveRename();
    });

    applySavedTheme();
    loadSavedVolume();
    fillSettingsInputs();
    loadPlaylistFromGitHub();
  </script>
</body>
</html>
