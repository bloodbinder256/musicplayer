<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fayelist - Music Player</title>

  <!-- Libraries & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;700;900&family=Poppins:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000000;
      --sidebar: #121212;
      --panel: #181818;
      --panel-hover: #282828;
      --text: #ffffff;
      --muted: #a7a7a7;
      --accent: #1ed760;
      --accent-hover: #1db954;
      --danger: #e91429;
      --shadow: rgba(0, 0, 0, 0.6);
      --card-radius: 8px;
      --app-font: 'Inter', sans-serif;
    }

    /* Theme Variants */
    body.theme-slate {
      --bg: #0f172a;
      --sidebar: #1e293b;
      --panel: #334155;
      --panel-hover: #475569;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body.theme-navy {
      --bg: #0b0f19;
      --sidebar: #111827;
      --panel: #1f2937;
      --panel-hover: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
    }

    body.theme-light {
      --bg: #f8f9fa;
      --sidebar: #ffffff;
      --panel: #f1f3f5;
      --panel-hover: #e9ecef;
      --text: #121212;
      --muted: #6c757d;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: var(--app-font);
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 1fr 90px;
      height: calc(100vh - 90px);
      background: var(--bg);
      gap: 8px;
      padding: 8px;
    }

    /* Sidebar */
    .sidebar {
      background: var(--sidebar);
      border-radius: 8px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .logo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      font-family: inherit;
      transition: color 0.2s, background 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text);
      background: var(--panel-hover);
    }

    .nav-item.active {
      color: var(--accent);
    }

    .playlist-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 10px;
      padding: 0 12px;
    }

    .playlist-section-header button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
    }

    .playlist-section-header button:hover {
      color: var(--text);
    }

    .custom-playlists {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
    }

    .sidebar-section {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Main Content Viewport */
    .main-viewport {
      background: var(--sidebar);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }

    .viewport-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .search-bar-wrap {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .search-bar-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-bar-wrap input {
      width: 100%;
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 500px;
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar-wrap input:focus {
      border-color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: var(--panel);
      border: none;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 500px;
      font-weight: 700;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:hover {
      background: var(--panel-hover);
      transform: scale(1.02);
    }

    .btn-accent {
      background: var(--accent);
      color: #000;
    }

    .btn-accent:hover {
      opacity: 0.9;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    /* Song Grid View */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
    }

    .song-card {
      background: var(--panel);
      padding: 16px;
      border-radius: var(--card-radius);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.3s, transform 0.2s;
      position: relative;
    }

    .song-card:hover {
      background: var(--panel-hover);
    }

    .song-card.active {
      border: 1px solid var(--accent);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: calc(var(--card-radius) - 2px);
      background: linear-gradient(135deg, #333, #111);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .card-cover i {
      font-size: 36px;
      color: var(--muted);
    }

    .card-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-menu-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .song-card:hover .card-menu-btn {
      display: flex;
    }

    /* List View Mode */
    .song-list-view {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr auto;
      align-items: center;
      padding: 10px 16px;
      border-radius: var(--card-radius);
      background: transparent;
      cursor: pointer;
      gap: 12px;
      transition: background 0.2s;
    }

    .song-row:hover {
      background: var(--panel);
    }

    .song-row.active {
      color: var(--accent);
      background: var(--panel);
    }

    /* Offline Screen */
    .offline-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--muted);
      gap: 16px;
      padding: 40px;
    }

    .offline-screen i {
      font-size: 48px;
      color: var(--danger);
    }

    /* Persistent Bottom Player Bar */
    .bottom-player {
      grid-column: 1 / -1;
      background: var(--bg);
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      z-index: 20;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-cover {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background: var(--panel);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .mini-cover i {
      font-size: 20px;
      color: var(--muted);
    }

    .mini-info .title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .mini-info .artist {
      font-size: 12px;
      color: var(--muted);
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      color: var(--text);
      transform: scale(1.1);
    }

    .control-btn.active-state {
      color: var(--accent);
    }

    .control-btn.play-pause {
      width: 36px;
      height: 36px;
      background: var(--text);
      color: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
    }

    .playback-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-size: 11px;
      color: var(--muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--text);
      cursor: pointer;
      height: 4px;
      border-radius: 2px;
    }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--muted);
    }

    .speed-dropdown {
      background: var(--panel);
      color: var(--text);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Modals */
    .panel-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: #242424;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 24px;
      border-radius: 12px;
      width: min(480px, 90%);
      z-index: 100;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: none;
      opacity: 0;
      transition: all 0.2s ease;
    }

    .panel-modal.show {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .panel-modal h3 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .panel-modal label {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin: 12px 0 6px;
    }

    .panel-modal input, .panel-modal select, .panel-modal textarea {
      width: 100%;
      background: #121212;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      outline: none;
      resize: vertical;
    }

    .accent-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #000;
      padding: 10px 20px;
      border-radius: 500px;
      font-weight: 700;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 150;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Bottom Navigation Bar */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 90px;
      left: 0;
      right: 0;
      background: var(--sidebar);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px;
      justify-content: space-around;
      z-index: 25;
    }

    .mobile-nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-family: inherit;
    }

    .mobile-nav-btn i {
      font-size: 18px;
    }

    .mobile-nav-btn.active {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .app-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 90px;
        padding-bottom: 70px;
      }
      .sidebar {
        display: none;
      }
      .mobile-nav {
        display: flex;
      }
      .bottom-player {
        grid-template-columns: 1fr auto;
      }
      .player-center {
        display: none;
      }
    }
  </style>
</head>

        <button class="nav-item" id="navLocal"><i class="fa-solid fa-file-arrow-down"></i> Drop Audio Files Here</button>

    <!-- Main Content Viewport -->
    <section class="main-viewport" id="dropZone">

    <!-- Persistent Bottom Player Bar -->

        <div class="mini-cover" id="miniCover">
          <i class="fa-solid fa-music"></i>
        </div>

          <div class="title" id="trackTitle">No track selected</div>
          <div class="artist" id="trackArtist">Connect GitHub repo</div>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="control-btn" id="shuffleBtn" title="Shuffle (S)"><i class="fa-solid fa-shuffle"></i></button>
          <button class="control-btn" id="prevBtn" title="Previous (Left Arrow)"><i class="fa-solid fa-backward-step"></i></button>
          <button class="control-btn play-pause" id="playBtn" title="Play/Pause (Space)"><i class="fa-solid fa-play"></i></button>
          <button class="control-btn" id="nextBtn" title="Next (Right Arrow)"><i class="fa-solid fa-forward-step"></i></button>
          <button class="control-btn" id="repeatBtn" title="Repeat (R)"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="playback-bar-row">
          <span id="currentTime">0:00</span>
          <input id="seekSlider" type="range" min="0" max="100" value="0">
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <select id="speedSelect" class="speed-dropdown" title="Playback Speed">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <button class="control-btn" id="muteBtn"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></button>
        <input id="volumeSlider" type="range" min="0" max="100" value="85" style="width: 80px;">
      </div>
    </footer>
  </main>

  <!-- Customization Modal -->
  <div class="panel-modal" id="customizeModal">
    <h3 style="margin-bottom:8px;">Customization Options</h3>

    <label>Background Theme</label>
    <select id="bgThemeSelect">
      <option value="dark">Pitch Black (Default)</option>
      <option value="theme-slate">Dark Slate</option>
      <option value="theme-navy">Deep Navy</option>
      <option value="theme-light">Light Mode</option>
    </select>

    <label>Font Family</label>
    <select id="fontSelect">
      <option value="'Inter', sans-serif">Inter (Modern Sans)</option>
      <option value="'Roboto', sans-serif">Roboto (Clean)</option>
      <option value="'Poppins', sans-serif">Poppins (Rounded)</option>
      <option value="'Courier Prime', monospace">Courier Prime (Retro Mono)</option>
    </select>

    <label>Card Corner Style</label>
    <select id="cardCornerSelect">
      <option value="8px">Rounded Corners (8px)</option>
      <option value="16px">Extra Smooth (16px)</option>
      <option value="0px">Sharp Edges (0px)</option>
    </select>

    <label>Accent Preset Palette</label>
    <div class="accent-presets">
      <div class="color-swatch" style="background:#1ed760;" onclick="setPresetAccent('#1ed760')"></div>
      <div class="color-swatch" style="background:#00d2ff;" onclick="setPresetAccent('#00d2ff')"></div>
      <div class="color-swatch" style="background:#a855f7;" onclick="setPresetAccent('#a855f7')"></div>
      <div class="color-swatch" style="background:#ff2a85;" onclick="setPresetAccent('#ff2a85')"></div>
      <div class="color-swatch" style="background:#ff8c00;" onclick="setPresetAccent('#ff8c00')"></div>
    </div>

    <label>Custom Accent Color</label>
    <input type="color" id="accentColorPicker" value="#1ed760" style="height: 40px; padding: 2px; cursor: pointer;">

    <div class="modal-actions">
      <button class="btn" id="resetCustomizeBtn">Reset All Defaults</button>
      <button class="btn btn-accent" id="saveCustomizeBtn">Save Customizations</button>
      <button class="btn" id="closeCustomizeBtn">Close</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="panel-modal" id="settingsModal">
    <h3>GitHub Repository Settings</h3>
    <input id="ownerInput" placeholder="GitHub username">
    <input id="repoInput" placeholder="Repository name">
    <input id="branchInput" placeholder="Branch (e.g. main)">
    <input id="folderInput" placeholder="Music folder name">
    <div class="modal-actions">
      <button class="btn" id="closeSettingsBtn">Cancel</button>
      <button class="btn btn-accent" id="saveSettingsBtn">Save & Reload</button>
    </div>
  </div>

  <!-- Sync Modal -->
  <div class="panel-modal" id="syncModal">
    <h3>Transfer & Manage Data</h3>
    <p style="color:var(--muted); font-size:13px; margin-top:0;">Export/import your sync code or clear local storage cache.</p>
    <textarea id="syncCodeArea" rows="4" placeholder="Export or paste sync code here..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-danger" id="clearDataBtn">Clear All Local Data</button>
      <button class="btn" id="exportSyncBtn">Copy Code</button>
      <button class="btn btn-accent" id="importSyncBtn">Load Code</button>
      <button class="btn" id="closeSyncModalBtn">Close</button>
    </div>
  </div>

  <!-- Playlists Modals -->
  <div class="panel-modal" id="playlistModal">
    <h3>Create New Playlist</h3>
    <input id="playlistNameInput" placeholder="Playlist name">
    <div class="modal-actions">
      <button class="btn" id="closePlaylistModalBtn">Cancel</button>
      <button class="btn btn-accent" id="savePlaylistBtn">Create</button>
    </div>
  </div>

  <div class="panel-modal" id="addToPlaylistModal">
    <h3>Add to Playlist</h3>
    <select id="targetPlaylistSelect"></select>
    <div class="modal-actions">
      <button class="btn" id="closeAddModalBtn">Cancel</button>
      <button class="btn btn-accent" id="confirmAddToPlaylistBtn">Add</button>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>
  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_SETTINGS = {
      owner: "bloodbinder256",
      repo: "musicplayer",
      branch: "main",
      folder: "music"
    };

    const AUDIO_EXTENSIONS = [".mp3", ".wav", ".ogg", ".flac", ".aac", ".m4a"];
    const STORAGE_KEYS = {
      settings: "fayelistSettings",
      renames: "fayelistRenames",
      theme: "fayelistTheme",
      volume: "fayelistVolume",
      history: "fayelistHistory",
      playlists: "fayelistCustomPlaylists",
      accent: "fayelistAccentColor",
      font: "fayelistFont",
      cardRadius: "fayelistCardRadius"
    };

    const audio = document.getElementById("audio");
    const contentContainer = document.getElementById("contentContainer");
    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const toastEl = document.getElementById("toast");
    const viewTitle = document.getElementById("viewTitle");

    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const seekSlider = document.getElementById("seekSlider");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeIcon = document.getElementById("volumeIcon");
    const muteBtn = document.getElementById("muteBtn");
    const speedSelect = document.getElementById("speedSelect");

    const prevBtn = document.getElementById("prevBtn");
    const playBtn = document.getElementById("playBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const searchInput = document.getElementById("searchInput");
    const sortBtn = document.getElementById("sortBtn");
    const viewToggleBtn = document.getElementById("viewToggleBtn");

    const settingsModal = document.getElementById("settingsModal");
    const sidebarSettingsBtn = document.getElementById("sidebarSettingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const ownerInput = document.getElementById("ownerInput");
    const repoInput = document.getElementById("repoInput");
    const branchInput = document.getElementById("branchInput");
    const folderInput = document.getElementById("folderInput");

    const customizeModal = document.getElementById("customizeModal");
    const sidebarCustomizeBtn = document.getElementById("sidebarCustomizeBtn");
    const closeCustomizeBtn = document.getElementById("closeCustomizeBtn");
    const saveCustomizeBtn = document.getElementById("saveCustomizeBtn");
    const resetCustomizeBtn = document.getElementById("resetCustomizeBtn");
    const accentColorPicker = document.getElementById("accentColorPicker");
    const bgThemeSelect = document.getElementById("bgThemeSelect");
    const fontSelect = document.getElementById("fontSelect");
    const cardCornerSelect = document.getElementById("cardCornerSelect");

    const syncModal = document.getElementById("syncModal");
    const sidebarSyncBtn = document.getElementById("sidebarSyncBtn");
    const closeSyncModalBtn = document.getElementById("closeSyncModalBtn");
    const exportSyncBtn = document.getElementById("exportSyncBtn");
    const importSyncBtn = document.getElementById("importSyncBtn");
    const clearDataBtn = document.getElementById("clearDataBtn");
    const syncCodeArea = document.getElementById("syncCodeArea");
    const mobSyncBtn = document.getElementById("mobSyncBtn");

    const playlistModal = document.getElementById("playlistModal");
    const newPlaylistBtn = document.getElementById("newPlaylistBtn");
    const closePlaylistModalBtn = document.getElementById("closePlaylistModalBtn");
    const savePlaylistBtn = document.getElementById("savePlaylistBtn");
    const playlistNameInput = document.getElementById("playlistNameInput");
    const customPlaylistsContainer = document.getElementById("customPlaylistsContainer");

    const addToPlaylistModal = document.getElementById("addToPlaylistModal");
    const closeAddModalBtn = document.getElementById("closeAddModalBtn");
    const confirmAddToPlaylistBtn = document.getElementById("confirmAddToPlaylistBtn");
    const targetPlaylistSelect = document.getElementById("targetPlaylistSelect");

    const navHome = document.getElementById("navHome");
    const navHistory = document.getElementById("navHistory");
    const navLocal = document.getElementById("navLocal");
    const dropZone = document.getElementById("dropZone");

    const mobHomeBtn = document.getElementById("mobHomeBtn");
    const mobPlaylistsBtn = document.getElementById("mobPlaylistsBtn");
    const mobHistoryBtn = document.getElementById("mobHistoryBtn");

    // Safe LocalStorage Parsers
    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || "null");
        return { ...DEFAULT_SETTINGS, ...(saved || {}) };
      } catch (e) {
        localStorage.removeItem(STORAGE_KEYS.settings);
        return DEFAULT_SETTINGS;
      }
    }
    function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }
    
    function loadRenames() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.renames) || "{}"); } 
      catch (e) { return {}; }
    }
    
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || "[]"); } 
      catch (e) { return []; }
    }
    function saveHistory() { localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(historyList)); }
    
    function loadPlaylists() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.playlists) || "{}"); } 
      catch (e) { return {}; }
    }
    function savePlaylists() { localStorage.setItem(STORAGE_KEYS.playlists, JSON.stringify(customPlaylists)); renderCustomPlaylistsNav(); }

    let settings = loadSettings();
    let renames = loadRenames();
    let historyList = loadHistory();
    let customPlaylists = loadPlaylists();
    let tracks = [];
    let filteredTracks = [];
    let currentTrackIndex = 0;
    let isShuffle = false;
    let isRepeat = false;
    let sortAscending = true;
    let isGridView = true;
    let currentViewMode = 'home';
    let activePlaylistName = null;
    let trackSelectedForPlaylist = null;
    let previousVolume = 85;

    function cleanFileName(name) {
      return decodeURIComponent(name).replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").replace(/\s+/g, " ").trim();
    }
    function getDisplayTitle(track) { return renames[track.filename] || track.originalTitle; }
    function isAudioFile(filename) { return AUDIO_EXTENSIONS.some(ext => filename.toLowerCase().endsWith(ext)); }

    function githubApiUrl() {
      const folder = settings.folder.split("/").map(encodeURIComponent).join("/");
      return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${folder}?ref=${settings.branch}`;
    }
    function rawGithubUrl(filename) {
      const encodedFolder = settings.folder.split("/").map(encodeURIComponent).join("/");
      return `https://raw.githubusercontent.com/${settings.owner}/${settings.repo}/${settings.branch}/${encodedFolder}/${encodeURIComponent(filename)}`;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    async function loadPlaylistFromGitHub() {
      if (!navigator.onLine) {
        renderOfflineScreen("No internet connection detected.");
        return;
      }

      try {
        const response = await fetch(githubApiUrl());
        if (!response.ok) throw new Error("GitHub request failed");
        const files = await response.json();
        tracks = files
          .filter(file => file.type === "file" && isAudioFile(file.name))
          .map(file => ({
            originalTitle: cleanFileName(file.name),
            filename: file.name,
            url: rawGithubUrl(file.name),
            githubPage: file.html_url
          }));
        applySearchAndSort();
        if (tracks.length > 0 && !audio.src) loadTrack(0);
        showToast(`${tracks.length} tracks loaded successfully`);
      } catch (error) {
        console.error(error);
        renderOfflineScreen("Could not reach GitHub repository.");
      }
    }

    function renderOfflineScreen(message) {
      contentContainer.innerHTML = `
        <div class="offline-screen">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <h3 style="margin:0; color:var(--text);">Offline Mode</h3>
          <p style="max-width:320px; margin:0;">${message}</p>
          <button class="btn btn-accent" onclick="loadPlaylistFromGitHub()" style="margin-top:10px;">Retry Connection</button>
        </div>
      `;
    }

    function renderCustomPlaylistsNav() {
      customPlaylistsContainer.innerHTML = "";
      const names = Object.keys(customPlaylists);
      if (names.length === 0) {
        customPlaylistsContainer.innerHTML = `<div style="color:var(--muted); font-size:12px; padding:4px 12px;">No custom playlists yet</div>`;
        return;
      }
      names.forEach(name => {
        const btn = document.createElement("button");
        btn.className = "nav-item";
        if (currentViewMode === `playlist_${name}`) btn.classList.add("active");
        btn.style.fontSize = "13px";
        btn.style.padding = "8px 12px";
        btn.innerHTML = `<i class="fa-solid fa-list-music"></i> ${name}`;
        btn.addEventListener("click", () => {
          currentViewMode = `playlist_${name}`;
          activePlaylistName = name;
          viewTitle.textContent = `Playlist: ${name}`;
          document.querySelectorAll('.nav-item').forEach(el => el.classList.remove("active"));
          btn.classList.add("active");
          applySearchAndSort();
        });
        customPlaylistsContainer.appendChild(btn);
      });
    }

    function applySearchAndSort() {
      let sourceTracks = tracks;
      if (currentViewMode === 'history') {
        sourceTracks = historyList;
      } else if (currentViewMode.startsWith('playlist_')) {
        const filenames = customPlaylists[activePlaylistName] || [];
        sourceTracks = tracks.filter(t => filenames.includes(t.filename));
      }

      const query = searchInput.value.trim().toLowerCase();
      filteredTracks = sourceTracks.filter(track => {
        const title = getDisplayTitle(track).toLowerCase();
        const file = track.filename.toLowerCase();
        return title.includes(query) || file.includes(query);
      });

      filteredTracks.sort((a, b) => {
        const res = getDisplayTitle(a).localeCompare(getDisplayTitle(b));
        return sortAscending ? res : -res;
      });

      renderContent();
    }

    function renderContent() {
      contentContainer.innerHTML = "";

      if (!filteredTracks.length) {
        contentContainer.innerHTML = `<div style="color:var(--muted); text-align:center; padding:50px;">No songs to display. Drag & drop audio files anywhere here!</div>`;
        return;
      }

      if (isGridView) {
        const grid = document.createElement("div");
        grid.className = "song-grid";
        filteredTracks.forEach((track) => {
          const realIndex = tracks.findIndex(item => item.filename === track.filename);
          const card = document.createElement("div");
          card.className = "song-card";
          if (realIndex === currentTrackIndex && currentViewMode === 'home') card.classList.add("active");

          card.innerHTML = `
            <div class="card-cover">
              <i class="fa-solid fa-music"></i>
            </div>
            <button class="card-menu-btn" title="Add to Playlist"><i class="fa-solid fa-plus"></i></button>
            <div class="card-title">${getDisplayTitle(track)}</div>
            <div class="card-subtitle">${track.filename}</div>
          `;

          card.querySelector('.card-menu-btn').addEventListener("click", (e) => {
            e.stopPropagation();
            openAddToPlaylistModal(track.filename);
          });

          card.addEventListener("click", () => {
            if (realIndex !== -1) {
              loadTrack(realIndex);
              playTrack();
            }
          });
          grid.appendChild(card);
        });
        contentContainer.appendChild(grid);
      } else {
        const list = document.createElement("div");
        list.className = "song-list-view";
        filteredTracks.forEach((track, idx) => {
          const realIndex = tracks.findIndex(item => item.filename === track.filename);
          const row = document.createElement("div");
          row.className = "song-row";
          if (realIndex === currentTrackIndex && currentViewMode === 'home') row.classList.add("active");

          row.innerHTML = `
            <div>${idx + 1}</div>
            <div style="font-weight:700;">${getDisplayTitle(track)}</div>
            <div style="color:var(--muted); font-size:13px;">${track.filename}</div>
            <button class="btn" style="padding:4px 8px; font-size:12px;" title="Add to Playlist"><i class="fa-solid fa-plus"></i></button>
          `;

          row.querySelector('button').addEventListener("click", (e) => {
            e.stopPropagation();
            openAddToPlaylistModal(track.filename);
          });

          row.addEventListener("click", () => {
            if (realIndex !== -1) {
              loadTrack(realIndex);
              playTrack();
            }
          });
          list.appendChild(row);
        });
        contentContainer.appendChild(list);
      }
    }

    function loadTrack(index) {
      if (!tracks.length) return;
      currentTrackIndex = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrackIndex];

      audio.src = track.url;
      audio.playbackRate = Number(speedSelect.value);
      trackTitle.textContent = getDisplayTitle(track);
      trackArtist.textContent = track.filename;
      seekSlider.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";

      if (!historyList.some(h => h.filename === track.filename)) {
        historyList.unshift(track);
        if (historyList.length > 20) historyList.pop();
        saveHistory();
      }

      renderContent();
    }

    function playTrack() {
      if (!audio.src) return;
      audio.play().then(() => { playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`; });
    }

    function pauseTrack() {
      audio.pause();
      playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
    }

    function togglePlay() {
      if (!audio.src) return;
      audio.paused ? playTrack() : pauseTrack();
    }

    function nextTrack() {
      if (!tracks.length) return;
      loadTrack(isShuffle ? Math.floor(Math.random() * tracks.length) : currentTrackIndex + 1);
      playTrack();
    }

    function previousTrack() {
      loadTrack(currentTrackIndex - 1);
      playTrack();
    }

    function openAddToPlaylistModal(filename) {
      trackSelectedForPlaylist = filename;
      targetPlaylistSelect.innerHTML = "";
      const names = Object.keys(customPlaylists);
      if (names.length === 0) {
        showToast("Create a playlist first!");
        return;
      }
      names.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        targetPlaylistSelect.appendChild(opt);
      });
      addToPlaylistModal.classList.add("show");
    }

    // Drag & Drop
    dropZone.addEventListener("dragover", (e) => e.preventDefault());
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files).filter(file => isAudioFile(file.name));
      if (files.length === 0) return;

      const newTracks = files.map(file => ({
        originalTitle: cleanFileName(file.name),
        filename: file.name,
        url: URL.createObjectURL(file),
        githubPage: "#"
      }));

      tracks.push(...newTracks);
      currentViewMode = 'home';
      viewTitle.textContent = "All Tracks (Includes Local)";
      applySearchAndSort();
      showToast(`Added ${files.length} local file(s)`);
      if (audio.src === "") loadTrack(tracks.length - newTracks.length);
    });

    // Event Handlers
    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", nextTrack);
    prevBtn.addEventListener("click", previousTrack);

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active-state", isShuffle);
    });

    repeatBtn.addEventListener("click", () => {
      isRepeat = !isRepeat;
      audio.loop = isRepeat;
      repeatBtn.classList.toggle("active-state", isRepeat);
    });

    audio.addEventListener("ended", () => { if (!isRepeat) nextTrack(); });
    audio.addEventListener("pause", () => { playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`; });
    audio.addEventListener("play", () => { playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`; });
    audio.addEventListener("loadedmetadata", () => { durationEl.textContent = formatTime(audio.duration); });
    audio.addEventListener("timeupdate", () => {
      if (!Number.isFinite(audio.duration)) return;
      seekSlider.value = (audio.currentTime / audio.duration) * 100 || 0;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    seekSlider.addEventListener("input", () => {
      if (!Number.isFinite(audio.duration)) return;
      audio.currentTime = (seekSlider.value / 100) * audio.duration;
    });

    volumeSlider.addEventListener("input", () => {
      const vol = Number(volumeSlider.value);
      audio.volume = vol / 100;
      localStorage.setItem(STORAGE_KEYS.volume, vol);
    });

    speedSelect.addEventListener("change", () => { audio.playbackRate = Number(speedSelect.value); });

    viewToggleBtn.addEventListener("click", () => {
      isGridView = !isGridView;
      viewToggleBtn.innerHTML = isGridView ? `<i class="fa-solid fa-table-cells-large"></i>` : `<i class="fa-solid fa-bars"></i>`;
      renderContent();
    });

    sortBtn.addEventListener("click", () => {
      sortAscending = !sortAscending;
      sortBtn.innerHTML = sortAscending ? `<i class="fa-solid fa-arrow-down-a-z"></i> Sort` : `<i class="fa-solid fa-arrow-up-z-a"></i> Sort`;
      applySearchAndSort();
    });

    searchInput.addEventListener("input", applySearchAndSort);

    navHome.addEventListener("click", () => { currentViewMode = 'home'; viewTitle.textContent = 'All Tracks'; applySearchAndSort(); });
    navHistory.addEventListener("click", () => { currentViewMode = 'history'; viewTitle.textContent = 'Recently Played'; applySearchAndSort(); });

    // Customization Modal Logic
    sidebarCustomizeBtn.addEventListener("click", () => {
      bgThemeSelect.value = localStorage.getItem(STORAGE_KEYS.theme) || "dark";
      fontSelect.value = localStorage.getItem(STORAGE_KEYS.font) || "'Inter', sans-serif";
      cardCornerSelect.value = localStorage.getItem(STORAGE_KEYS.cardRadius) || "8px";
      accentColorPicker.value = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || "#1ed760";
      customizeModal.classList.add("show");
    });

    closeCustomizeBtn.addEventListener("click", () => customizeModal.classList.remove("show"));

    function setPresetAccent(color) {
      accentColorPicker.value = color;
    }

    saveCustomizeBtn.addEventListener("click", () => {
      const selectedTheme = bgThemeSelect.value;
      const selectedFont = fontSelect.value;
      const selectedRadius = cardCornerSelect.value;
      const selectedAccent = accentColorPicker.value;

      document.body.className = selectedTheme === "dark" ? "" : selectedTheme;
      document.documentElement.style.setProperty('--app-font', selectedFont);
      document.documentElement.style.setProperty('--card-radius', selectedRadius);
      document.documentElement.style.setProperty('--accent', selectedAccent);

      localStorage.setItem(STORAGE_KEYS.theme, selectedTheme);
      localStorage.setItem(STORAGE_KEYS.font, selectedFont);
      localStorage.setItem(STORAGE_KEYS.cardRadius, selectedRadius);
      localStorage.setItem(STORAGE_KEYS.accent, selectedAccent);

      customizeModal.classList.remove("show");
      showToast("Customization saved!");
    });

    resetCustomizeBtn.addEventListener("click", () => {
      document.body.className = "";
      document.documentElement.style.setProperty('--app-font', "'Inter', sans-serif");
      document.documentElement.style.setProperty('--card-radius', '8px');
      document.documentElement.style.setProperty('--accent', '#1ed760');

      [STORAGE_KEYS.theme, STORAGE_KEYS.font, STORAGE_KEYS.cardRadius, STORAGE_KEYS.accent].forEach(k => localStorage.removeItem(k));
      customizeModal.classList.remove("show");
      showToast("Reset to defaults");
    });

    sidebarSettingsBtn.addEventListener("click", () => settingsModal.classList.add("show"));
    closeSettingsBtn.addEventListener("click", () => settingsModal.classList.remove("show"));
    saveSettingsBtn.addEventListener("click", () => {
      settings = {
        owner: ownerInput.value.trim() || DEFAULT_SETTINGS.owner,
        repo: repoInput.value.trim() || DEFAULT_SETTINGS.repo,
        branch: branchInput.value.trim() || DEFAULT_SETTINGS.branch,
        folder: folderInput.value.trim() || DEFAULT_SETTINGS.folder
      };
      saveSettings();
      settingsModal.classList.remove("show");
      loadPlaylistFromGitHub();
    });

    sidebarSyncBtn.addEventListener("click", () => syncModal.classList.add("show"));
    closeSyncModalBtn.addEventListener("click", () => syncModal.classList.remove("show"));

    exportSyncBtn.addEventListener("click", () => {
      try {
        const dataToExport = {
          settings: loadSettings(),
          renames: loadRenames(),
          history: loadHistory(),
          playlists: loadPlaylists(),
          theme: localStorage.getItem(STORAGE_KEYS.theme),
          volume: localStorage.getItem(STORAGE_KEYS.volume),
          accent: localStorage.getItem(STORAGE_KEYS.accent),
          font: localStorage.getItem(STORAGE_KEYS.font),
          cardRadius: localStorage.getItem(STORAGE_KEYS.cardRadius)
        };
        const encoded = btoa(encodeURIComponent(JSON.stringify(dataToExport)));
        syncCodeArea.value = encoded;
        syncCodeArea.select();
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(encoded).then(() => {
            showToast("Sync code generated & copied!");
          }).catch(() => {
            showToast("Sync code generated!");
          });
        } else {
          showToast("Sync code generated!");
        }
      } catch (err) {
        console.error(err);
        showToast("Error generating sync code");
      }
    });

    importSyncBtn.addEventListener("click", () => {
      try {
        const rawCode = syncCodeArea.value;
        if (!rawCode) return;
        const code = rawCode.replace(/\s+/g, '');
        const decoded = JSON.parse(decodeURIComponent(atob(code)));
        
        if (decoded.settings) localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(decoded.settings));
        if (decoded.renames) localStorage.setItem(STORAGE_KEYS.renames, JSON.stringify(decoded.renames));
        if (decoded.history) localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(decoded.history));
        if (decoded.playlists) localStorage.setItem(STORAGE_KEYS.playlists, JSON.stringify(decoded.playlists));
        if (decoded.theme) localStorage.setItem(STORAGE_KEYS.theme, decoded.theme);
        if (decoded.volume) localStorage.setItem(STORAGE_KEYS.volume, decoded.volume);
        if (decoded.accent) localStorage.setItem(STORAGE_KEYS.accent, decoded.accent);
        if (decoded.font) localStorage.setItem(STORAGE_KEYS.font, decoded.font);
        if (decoded.cardRadius) localStorage.setItem(STORAGE_KEYS.cardRadius, decoded.cardRadius);

        showToast("Data imported successfully! Reloading...");
        setTimeout(() => location.reload(), 1200);
      } catch (e) {
        console.error(e);
        showToast("Invalid sync code. Check text and try again.");
      }
    });

    clearDataBtn.addEventListener("click", () => {
      if (confirm("Are you sure you want to clear all saved playlists and settings?")) {
        Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
        location.reload();
      }
    });

    newPlaylistBtn.addEventListener("click", () => playlistModal.classList.add("show"));
    closePlaylistModalBtn.addEventListener("click", () => playlistModal.classList.remove("show"));
    savePlaylistBtn.addEventListener("click", () => {
      const name = playlistNameInput.value.trim();
      if (name && !customPlaylists[name]) {
        customPlaylists[name] = [];
        savePlaylists();
        playlistModal.classList.remove("show");
      }
    });

    closeAddModalBtn.addEventListener("click", () => addToPlaylistModal.classList.remove("show"));
    confirmAddToPlaylistBtn.addEventListener("click", () => {
      const playlistName = targetPlaylistSelect.value;
      if (playlistName && trackSelectedForPlaylist) {
        if (!customPlaylists[playlistName].includes(trackSelectedForPlaylist)) {
          customPlaylists[playlistName].push(trackSelectedForPlaylist);
          savePlaylists();
          showToast(`Added to ${playlistName}`);
        }
        addToPlaylistModal.classList.remove("show");
      }
    });

    // Apply saved customizations on load
    const savedTheme = localStorage.getItem(STORAGE_KEYS.theme);
    if (savedTheme && savedTheme !== "dark") document.body.classList.add(savedTheme);

    const savedFont = localStorage.getItem(STORAGE_KEYS.font);
    if (savedFont) document.documentElement.style.setProperty('--app-font', savedFont);

    const savedRadius = localStorage.getItem(STORAGE_KEYS.cardRadius);
    if (savedRadius) document.documentElement.style.setProperty('--card-radius', savedRadius);

    const savedAccent = localStorage.getItem(STORAGE_KEYS.accent);
    if (savedAccent) document.documentElement.style.setProperty('--accent', savedAccent);

    renderCustomPlaylistsNav();
    loadPlaylistFromGitHub();
  </script>
</body>
</html>
